<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>مكافحة التنمر — مع لوحة أدمن متقدمة — حسام طلال سالم</title>
  <style>
    :root {
      --bg: #f9fbfd;
      --text: #222;
      --card: #fff;
      --header-bg: #0b8a63;
      --header-text: #fff;
      --accent: #0b8a63;
      --footer-bg: #f0f5f3;
      --footer-text: #444;
    }
    body.dark {
      --bg: #121212;
      --text: #eee;
      --card: #1e1e1e;
      --header-bg: #0d523f;
      --header-text: #eee;
      --accent: #5dddb4;
      --footer-bg: #1b1b1b;
      --footer-text: #bbb;
    }
    * { box-sizing: border-box }
    body {
      margin: 0;
      font-family: 'Tahoma', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      transition: background 0.3s, color 0.3s;
    }
    .marquee {
      background: red;
      color: #fff;
      padding: 10px;
      font-weight: bold;
      font-size: 18px;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }
    .marquee span {
      display: inline-block;
      padding-right: 100%;
      animation: marquee 12s linear infinite;
    }
    @keyframes marquee {
      0%   { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    header {
      background: var(--header-bg);
      color: var(--header-text);
      text-align: center;
      padding: 25px 15px;
      position: relative;
    }
    h1 { margin: 0; font-size: 28px }
    h2 { color: var(--accent); margin: 0 0 8px; text-align:center }
    .container { max-width: 980px; margin: auto; padding: 20px }
    .card {
      background: var(--card);
      border-radius: 10px;
      padding: 20px;
      margin: 20px 0;
      box-shadow: 0 3px 8px rgba(0,0,0,0.08);
      transition: background 0.3s, color 0.3s;
    }
    .card img { width: 80px; display:block; margin: 12px auto }
    footer {
      text-align: center;
      padding: 15px;
      background: var(--footer-bg);
      color: var(--footer-text);
      margin-top: 20px;
      border-top: 2px solid var(--accent);
      transition: background 0.3s, color 0.3s;
    }
    .name { font-weight: bold; color: #ffcc00; font-size:18px }
    body.dark .name { color: #ffeb70 }
    .toggle-btn, .admin-btn {
      position: absolute;
      top: 15px;
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .toggle-btn {
      left: 15px;
      background: #fff;
      color: var(--accent);
    }
    .admin-btn {
      right: 15px;
      background: #222;
      color: #fff;
    }
    body.dark .toggle-btn { background: #333; color: #eee; }
    #toTop {
      display:none;
      position:fixed;
      bottom:20px;
      right:20px;
      z-index:99;
      border:none;
      outline:none;
      background:var(--accent);
      color:white;
      cursor:pointer;
      padding:12px 16px;
      border-radius:8px;
      font-size:16px;
    }
    body.dark #toTop { background:var(--accent); color:#000; }
    /* Login & Admin Panel */
    #loginBox, #adminPanel { display:none; }
    #loginBox {
      position:fixed; top:50%; left:50%;
      transform:translate(-50%,-50%);
      background:#fff; padding:20px; border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.3);
      z-index:999; width:320px;
    }
    #loginBox input { display:block; margin:10px 0; padding:8px; width:100%; }
    #loginBox button { padding:8px 15px; background:var(--accent); color:#fff; border:none; border-radius:5px; cursor:pointer; width:100% }
    #adminPanel {
      background:#eef7f4; padding:15px; border:2px solid var(--accent);
      margin:20px 0; border-radius:8px;
    }
    #adminPanel h3 { margin: 0 0 10px }
    .row { display:flex; gap:10px; flex-wrap:wrap }
    .row > * { flex:1 }
    .btn-sm { padding:6px 10px; border:none; border-radius:6px; cursor:pointer }
    .btn-accent { background: var(--accent); color:#fff }
    .btn-ghost { background:#fff; border:1px solid var(--accent); color:var(--accent) }
    .sec-actions { text-align:center; margin-top:10px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap }
    .muted { color:#666; font-size:13px }
    .settings { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px }
    @media(max-width:720px){ .settings{ grid-template-columns:1fr } }
    .hidden { display:none }
    label { font-size:13px; color:#333 }
    input[type="text"], input[type="email"], input[type="password"], textarea {
      width:100%; padding:8px; border:1px solid #cfd9d6; border-radius:6px;
      background: #fff;
    }
    textarea { min-height: 90px }
  </style>
</head>
<body>
  <div class="marquee"><span id="mqText">✋🚫 لا للتنمر — معاً لبيئة مدرسية آمنة — ✋🚫 لا للتنمر</span></div>
  <header>
    <button class="toggle-btn" onclick="toggleMode()">🌙/☀️</button>
    <button id="loginBtn" class="admin-btn" onclick="showLogin()">دخول الأدمن</button>دخول الأدمن</button>
    <h1>موقع التوعية ضد التنمر</h1>
    <p>إعداد: <span class="name" id="studentName">حسام طلال سالم — الصف 2/1</span></p>
  </header>

  <!-- Login Modal -->
  <div id="loginBox">
    <h3>تسجيل دخول الأدمن</h3>
    <input type="email" id="adminEmail" placeholder="الإيميل">
    <input type="password" id="adminPass" placeholder="كلمة السر">
    <button onclick="loginAdmin()">دخول</button>
  </div>

  <!-- Admin Panel -->
  <div class="container">
    <div id="adminPanel" class="card">
      <h3>لوحة تحكم الأدمن (تحكم كامل)</h3>
      <button class="btn btn-del" style="background:#d9534f;color:#fff" onclick="logoutAdmin()">🚪 تسجيل خروج</button>

      <div class="settings">
        <div>
          <label>اسم الطالب/الصف</label>
          <input type="text" id="inpName" placeholder="مثال: حسام طلال سالم — الصف 2/1">
        </div>
        <div>
          <label>نص الشريط العلوي</label>
          <input type="text" id="inpMarquee" placeholder="✋🚫 لا للتنمر — معاً لبيئة مدرسية آمنة — ✋🚫 لا للتنمر">
        </div>
        <div>
          <label>لون الخلفية الأساسي (header)</label>
          <input type="text" id="inpHeaderColor" placeholder="#0b8a63">
        </div>
        <div>
          <label>سرعة الشريط (ثواني للدورة الواحدة)</label>
          <input type="text" id="inpMarqueeSpeed" placeholder="12">
        </div>
      </div>

      <div style="margin-top:10px" class="row">
        <button class="btn-sm btn-accent" onclick="applySettings()">تطبيق الإعدادات</button>
        <button class="btn-sm btn-ghost" onclick="exportData()">💾 تصدير الإعدادات</button>
        <input type="file" id="importFile" class="hidden" accept="application/json" onchange="importData(this.files[0])">
        <button class="btn-sm btn-ghost" onclick="document.getElementById('importFile').click()">📂 استيراد الإعدادات</button>
        <button class="btn-sm btn-ghost" onclick="resetAll()">♻️ إعادة الضبط</button>
        <span class="muted">كل شيء محفوظ محليًا (LocalStorage)</span>
      </div>

      <hr style="margin:14px 0;border-color:#cfe5de">

      <h4 style="text-align:center;margin:0 0 10px">إدارة الأقسام</h4>
      <div class="row" style="align-items:flex-end">
        <div>
          <label>عنوان القسم</label>
          <input type="text" id="secTitle" placeholder="عنوان القسم">
        </div>
        <div>
          <label>رابط أيقونة PNG/SVG (اختياري)</label>
          <input type="text" id="secIcon" placeholder="https://...png">
        </div>
      </div>
      <div>
        <label>محتوى القسم</label>
        <textarea id="secText" placeholder="محتوى القسم"></textarea>
      </div>
      <div class="row">
        <button class="btn-sm btn-accent" onclick="addSection()">➕ إضافة قسم</button>
        <button class="btn-sm btn-ghost" onclick="saveAll()">حفظ يدوي</button>
      </div>
    </div>
  </div>

  <main class="container" id="content">
    <!-- الأقسام تُعرض هنا -->
  </main>

  <footer>
    &copy; 2025 — أعدّه الطالب <span class="name" id="studentNameFooter">حسام طلال سالم — الصف 2/1</span>
  </footer>

  <button onclick="topFunction()" id="toTop" title="رجوع للأعلى">⬆️ للأعلى</button>

  <script>
    // ======= Data Model =======
    const DEFAULT_DATA = {
      name: "حسام طلال سالم — الصف 2/1",
      marquee: "✋🚫 لا للتنمر — معاً لبيئة مدرسية آمنة — ✋🚫 لا للتنمر",
      marqueeSpeed: 12,
      headerColor: "#0b8a63",
      sections: [
        {title:"ما هو التنمر؟", icon:"https://cdn-icons-png.flaticon.com/512/2910/2910768.png", text:"التنمر هو سلوك متكرر يهدف لإيذاء شخص آخر سواءً بالكلام، أو الجسد، أو عبر الإنترنت."},
        {title:"أنواع التنمر", icon:"https://cdn-icons-png.flaticon.com/512/3135/3135715.png", text:"التنمر اللفظي - الجسدي - الاجتماعي - الإلكتروني."},
        {title:"أضرار التنمر", icon:"https://cdn-icons-png.flaticon.com/512/564/564619.png", text:"مشاكل نفسية، اجتماعية، دراسية، وصحية."},
        {title:"أسباب التنمر", icon:"https://cdn-icons-png.flaticon.com/512/1041/1041916.png", text:"البيت، المدرسة، المجتمع، الإنترنت."},
        {title:"أهم مواضيع التنمر", icon:"https://cdn-icons-png.flaticon.com/512/3135/3135810.png", text:"التنمر في المدارس، الألعاب، العمل، الأسرة."},
        {title:"نتائج التنمر على المجتمع", icon:"https://cdn-icons-png.flaticon.com/512/1828/1828940.png", text:"العنف، الكراهية، ضعف العلاقات، إعاقة التعليم."},
        {title:"كيف نوقف التنمر؟", icon:"https://cdn-icons-png.flaticon.com/512/1828/1828778.png", text:"التبليغ، التوعية، دعم الضحية، القوانين."},
        {title:"خاتمة", icon:"https://cdn-icons-png.flaticon.com/512/942/942748.png", text:"يجب أن نتعاون جميعاً لنشر الاحترام ودعم الضحايا."}
      ]
    };

    function loadData(){
      const saved = localStorage.getItem("ab_site_data");
      return saved ? JSON.parse(saved) : DEFAULT_DATA;
    }
    function saveData(data){
      localStorage.setItem("ab_site_data", JSON.stringify(data));
    }

    // ======= Render =======
    function renderAll(){
      const data = loadData();
      // header name
      document.getElementById("studentName").textContent = data.name;
      document.getElementById("studentNameFooter").textContent = data.name;
      // marquee
      document.getElementById("mqText").textContent = data.marquee;
      document.documentElement.style.setProperty("--header-bg", data.headerColor);
      // marquee speed
      const mq = document.querySelector(".marquee span");
      mq.style.animationDuration = (parseFloat(data.marqueeSpeed)||12) + "s";

      // inputs reflect data
      document.getElementById("inpName").value = data.name;
      document.getElementById("inpMarquee").value = data.marquee;
      document.getElementById("inpHeaderColor").value = data.headerColor;
      document.getElementById("inpMarqueeSpeed").value = data.marqueeSpeed;

      // sections
      const wrap = document.getElementById("content");
      wrap.innerHTML = "";
      data.sections.forEach((sec, i)=>{
        const el = document.createElement("section");
        el.className = "card";
        el.innerHTML = `
          ${sec.icon ? `<img src="${sec.icon}" alt="icon">` : ""}
          <h2>${sec.title}</h2>
          <p>${sec.text}</p>
          ${isAdmin() ? `
            <div class="sec-actions">
              <button class="btn-sm btn-accent" onclick="editSection(${i})">✏️ تعديل</button>
              <button class="btn-sm btn-ghost" onclick="moveUp(${i})">⬆️</button>
              <button class="btn-sm btn-ghost" onclick="moveDown(${i})">⬇️</button>
              <button class="btn-sm" style="background:#d9534f;color:#fff" onclick="deleteSection(${i})">🗑️ حذف</button>
            </div>
          ` : ""}
        `;
        wrap.appendChild(el);
      });
    }

    // ======= Admin Auth =======
    function isAdmin(){ return localStorage.getItem("isAdmin") === "true"; }
    function showLogin(){ document.getElementById("loginBox").style.display="block"; }
    function loginAdmin(){
      let email=document.getElementById("adminEmail").value;
      let pass=document.getElementById("adminPass").value;
      if(email=="thossam099@gmail.com" && pass=="Talal6500a"){
        localStorage.setItem("isAdmin","true");
        document.getElementById("loginBox").style.display="none";
        document.getElementById("adminPanel").style.display="block";
        renderAll();
      } else {
        alert("بيانات الدخول خاطئة");
      }
    }

    // ======= Admin Settings =======
    function applySettings(){
      const data = loadData();
      data.name = document.getElementById("inpName").value || data.name;
      data.marquee = document.getElementById("inpMarquee").value || data.marquee;
      data.headerColor = document.getElementById("inpHeaderColor").value || data.headerColor;
      data.marqueeSpeed = parseFloat(document.getElementById("inpMarqueeSpeed").value)||data.marqueeSpeed;
      saveData(data);
      renderAll();
    }
    function exportData(){
      const data = loadData();
      const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "anti_bullying_settings.json";
      a.click();
      URL.revokeObjectURL(a.href);
    }
    function importData(file){
      const reader = new FileReader();
      reader.onload = (e)=>{
        try{
          const json = JSON.parse(e.target.result);
          saveData(json); renderAll();
          alert("تم الاستيراد بنجاح");
        }catch(err){ alert("ملف غير صالح"); }
      };
      reader.readAsText(file);
    }
    function resetAll(){
      localStorage.removeItem("ab_site_data");
      localStorage.removeItem("isAdmin");
      location.reload();
    }

    // ======= Sections CRUD =======
    function addSection(){
      const title = document.getElementById("secTitle").value.trim();
      const text  = document.getElementById("secText").value.trim();
      const icon  = document.getElementById("secIcon").value.trim();
      if(!title || !text){ alert("أدخل عنوانًا ومحتوى"); return; }
      const data = loadData();
      data.sections.push({title, text, icon});
      saveData(data);
      document.getElementById("secTitle").value = "";
      document.getElementById("secText").value = "";
      document.getElementById("secIcon").value = "";
      renderAll();
    }
    function deleteSection(i){
      const data = loadData();
      data.sections.splice(i,1);
      saveData(data);
      renderAll();
    }
    function moveUp(i){
      const data = loadData();
      if(i>0){ [data.sections[i-1], data.sections[i]] = [data.sections[i], data.sections[i-1]]; }
      saveData(data); renderAll();
    }
    function moveDown(i){
      const data = loadData();
      if(i<data.sections.length-1){ [data.sections[i+1], data.sections[i]] = [data.sections[i], data.sections[i+1]]; }
      saveData(data); renderAll();
    }
    function editSection(i){
      const data = loadData();
      const sec = data.sections[i];
      const t = prompt("عنوان القسم:", sec.title);
      if(t===null) return;
      const ic = prompt("رابط الأيقونة (اختياري):", sec.icon||"");
      if(ic===null) return;
      const tx = prompt("نص القسم:", sec.text);
      if(tx===null) return;
      data.sections[i] = {title: t.trim()||sec.title, icon: ic.trim(), text: tx.trim()||sec.text};
      saveData(data); renderAll();
    }

    // ======= UI helpers =======
    function toggleMode(){ document.body.classList.toggle('dark'); }
    let btn = document.getElementById("toTop");
    window.onscroll = function() {scrollFunction()};
    function scrollFunction() {
      if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
        btn.style.display = "block";
      } else {
        btn.style.display = "none";
      }
    }
    function topFunction() {
      document.body.scrollTop = 0;
      document.documentElement.scrollTop = 0;
    }

    // Init
    (function init(){
      renderAll();
      if(isAdmin()){ document.getElementById("adminPanel").style.display="block"; }
    })();
  </script>
</body>
</html>
